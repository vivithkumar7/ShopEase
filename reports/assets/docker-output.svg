<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">ShopEase Docker build and runtime output summary</title>
  <desc id="desc">Formatted evidence summary: Docker image build completed and the container served root and Swagger endpoints with HTTP 200.</desc>
  <rect width="1440" height="900" fill="#111827"/>
  <rect width="1440" height="66" fill="#263449"/>
  <circle cx="30" cy="33" r="8" fill="#ff6b6b"/>
  <circle cx="56" cy="33" r="8" fill="#ffd166"/>
  <circle cx="82" cy="33" r="8" fill="#06d6a0"/>
  <text x="116" y="41" fill="#e6edf3" font-family="Segoe UI, Arial" font-size="20">PowerShell — Docker verification summary</text>
  <g font-family="Consolas, monospace" font-size="21">
    <text x="52" y="122" fill="#72d6a0">PS D:\ShopEase\shopease-product-service&gt; docker build -t shopease-product-service-report .</text>
    <text x="52" y="164" fill="#a8b7c8">#6 [1/5] FROM python:3.12-slim</text>
    <text x="52" y="202" fill="#a8b7c8">#7 [2/5] WORKDIR /service · CACHED</text>
    <text x="52" y="240" fill="#a8b7c8">#8 [3/5] COPY requirements.txt . · CACHED</text>
    <text x="52" y="278" fill="#a8b7c8">#9 [4/5] RUN pip install -r requirements.txt · CACHED</text>
    <text x="52" y="316" fill="#a8b7c8">#10 [5/5] COPY app ./app</text>
    <text x="52" y="365" fill="#72d6a0">#11 DONE · naming to shopease-product-service-report:latest</text>
    <text x="52" y="427" fill="#72d6a0">PS&gt; docker run -d --name shopease-report-runtime -p 127.0.0.1:18003:8003 shopease-product-service-report</text>
    <text x="52" y="469" fill="#a8b7c8">Container started · Uvicorn listening on 0.0.0.0:8003</text>
    <text x="52" y="531" fill="#72d6a0">PS&gt; curl.exe -i http://127.0.0.1:18003/</text>
    <text x="52" y="573" fill="#8be9fd">HTTP/1.1 200 OK · application/json</text>
    <text x="52" y="615" fill="#e6edf3">{"message":"Welcome to the ShopEase Product Service"}</text>
    <text x="52" y="677" fill="#72d6a0">PS&gt; curl.exe http://127.0.0.1:18003/docs</text>
    <text x="52" y="719" fill="#8be9fd">HTTP 200 OK · Swagger UI available</text>
    <text x="52" y="791" fill="#a8b7c8">Container smoke check passed; no database host was configured for this check.</text>
